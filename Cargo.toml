[package]
name = "mulu"
version = "1.2.3"
edition = "2024"

[features]
default = ["updater"]
# In-app update checker (pings GitHub releases). Only for self-distributed builds
# (dmg/deb/pacman); builds whose updates come from elsewhere disable it: the Mac
# App Store (guideline 2.4.5) and package managers such as Nix.
updater = ["dep:ureq", "dep:serde", "dep:semver"]

[dependencies]
# gpui-kit builds against the `gpui-pre-*` crates.io snapshots of Zed's GPUI and pins
# an exact version; keep these in lockstep with the pin in gpui-kit's Cargo.toml.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-kit" }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit" }
mtp-rs = "0.13"
nusb = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "sync"] }
bytes = "1"
futures = "0.3"
rust-i18n = "4"
sys-locale = "0.3"
ureq = { version = "2", default-features = false, features = ["tls", "json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
semver = { version = "1", optional = true }

[package.metadata.packager]
product-name = "Mulu"
identifier = "net.yangkx.mulu"
before-packaging-command = "cargo build --release"
icons = [
    "linux-icons/32x32.png",
    "linux-icons/128x128.png",
    "linux-icons/256x256.png",
    "linux-icons/512x512.png",
    "linux-icons/1024x1024.png",
    "Mulu.icns",
]
formats = ["deb", "pacman", "dmg"]
category = "Utility"

[package.metadata.packager.macos]
minimum-system-version = "12.0"

[package.metadata.packager.deb]
# Also used for pacman; shared with the Nix package.
desktop-template = "mulu.desktop"
depends = [
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libfontconfig1",
  "libfreetype6",
  "libxcb1",
  "libwayland-client0",
]

[package.metadata.packager.pacman]
depends = [
  "libxkbcommon",
  "fontconfig",
  "freetype2",
  "libxcb",
  "wayland",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
