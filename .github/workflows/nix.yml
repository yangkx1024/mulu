name: Nix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "locales/**"
      - "linux-icons/**"
      - "mulu.desktop"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "src/**"
      - "locales/**"
      - "linux-icons/**"
      - "mulu.desktop"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".github/workflows/nix.yml"

jobs:
  build:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix run nixpkgs#nixfmt -- --check flake.nix nix/package.nix

      - name: Build
        run: |
          if ! nix build -L .#mulu; then
            echo "::error::nix build failed. If Cargo.lock changed, refresh cargoHash with: nix run nixpkgs#nix-update -- --flake --version=skip mulu"
            exit 1
          fi
